# Render Blueprint: in Render, New > Blueprint, then pick this repository.
# NEXT_PUBLIC_* values are baked in at build time, so redeploy after changing them.
services:
  - type: web
    name: xquery-website
    runtime: node
    # "free" sleeps after 15 minutes without traffic; use "starter" or above for the live site.
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # Backend base URL: the "xquery-api" Render service from Xquery.io-backend.
      # Switch to https://api.xquery.io once that custom domain is live. Remove it to run on demo data.
      - key: NEXT_PUBLIC_API_URL
        value: https://xquery-api.onrender.com
      - key: NEXT_PUBLIC_SITE_URL
        value: https://xquery.io
