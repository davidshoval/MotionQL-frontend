# Render Blueprint: in Render, New > Blueprint, then pick this repository.
# NEXT_PUBLIC_* values are baked in at build time, so redeploy after changing them.
services:
  - type: web
    # Keep the pre-rename service name: changing it makes Render create a new service.
    name: xquery-website
    runtime: node
    # "free" sleeps after 15 minutes without traffic; "starter" stays awake.
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # Backend base URL: the "xquery-api" Render service from Xquery.io-backend (pre-rename names, kept).
      # Switch to https://api.motionql.com once that custom domain is live. Remove it to run on demo data.
      - key: NEXT_PUBLIC_API_URL
        value: https://xquery-api.onrender.com
      # Canonical URL. The service also stays reachable at https://xquery-website.onrender.com.
      - key: NEXT_PUBLIC_SITE_URL
        value: https://motionql.com
